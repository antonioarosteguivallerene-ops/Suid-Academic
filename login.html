<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Suid Academy</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' https://cdnjs.cloudflare.com;">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
<main class="auth-card">
  <a class="logo" href="index.html"><img src="assets/logo-mark.png" class="logo-icon" alt="" width="28" height="28"> Suid Academy</a>
  <p class="draft">Demo sin servidor: la sesión se guarda solo en este navegador y no es segura. No uses contraseñas reales.</p>

  <div class="role-tabs" role="tablist" aria-label="Tipo de cuenta">
    <button class="role-tab active" data-role="estudiante" role="tab" aria-selected="true">Estudiante</button>
    <button class="role-tab" data-role="docente" role="tab" aria-selected="false">Docente</button>
    <button class="role-tab" data-role="admin" role="tab" aria-selected="false">Administrador</button>
  </div>

  <form id="loginForm" novalidate>
    <label for="email">Correo</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">
    <p class="form-error hidden" id="loginError" role="alert">Correo, contraseña o rol incorrectos.</p>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>

  <div class="demo-creds">
    <strong>Credenciales de prueba</strong>
    <code>estudiante@suid.academy / estudiante123</code>
    <code>docente@suid.academy / docente123</code>
    <code>admin@suid.academy / admin123</code>
  </div>
</main>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
